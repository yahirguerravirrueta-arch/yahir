<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario Compartido 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📖 Nuestro Diario</h1>

    <!-- Login / Registro -->
    <div id="loginDiv">
      <input type="email" id="emailInput" placeholder="Correo electrónico">
      <input type="password" id="passwordInput" placeholder="Contraseña">
      <input type="text" id="nicknameInput" placeholder="Elige un apodo">
      <button id="loginBtn">Iniciar sesión / Registrarse</button>
    </div>

    <!-- Chat -->
    <div id="chatDiv" style="display:none;">
      <form id="noteForm">
        <textarea id="noteInput" placeholder="Escribe algo bonito..." required></textarea>
        <button type="submit">💌 Enviar</button>
      </form>
      <div id="timeline"></div>
    </div>

  </div>

  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
